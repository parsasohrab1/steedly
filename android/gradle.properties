# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Backend base URLs (must end with /api/). Override per machine in
# ~/.gradle/gradle.properties or with -PSTEEDLY_API_URL_DEBUG=...
# 10.0.2.2 is the host machine as seen from the Android emulator.
STEEDLY_API_URL_DEBUG=http://10.0.2.2:3000/api/
STEEDLY_API_URL_RELEASE=https://api.steedly.ir/api/
