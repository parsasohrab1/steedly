services:
  postgres:
    image: postgres:15-alpine
    container_name: steedly-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-steedly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-steedly_password}
      POSTGRES_DB: ${POSTGRES_DB:-steedly}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - steedly-network

  redis:
    image: redis:7-alpine
    container_name: steedly-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - steedly-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend-prod
    container_name: steedly-backend
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-steedly}:${POSTGRES_PASSWORD:-steedly_password}@postgres:5432/${POSTGRES_DB:-steedly}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3001}
      API_URL: ${API_URL:-http://localhost:3000/api}
      PAYMENT_GATEWAY: ${PAYMENT_GATEWAY:-mock}
      ZARINPAL_MERCHANT_ID: ${ZARINPAL_MERCHANT_ID:-}
      ZARINPAL_SANDBOX: ${ZARINPAL_SANDBOX:-true}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # The backend runs from /app/backend and stores files in ./uploads relative to it
      - ./uploads:/app/backend/uploads
    networks:
      - steedly-network
    restart: unless-stopped

  # One-off: creates the admin user and sample content (safe to run repeatedly)
  #   docker compose run --rm seed
  seed:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend-prod
    profiles: ["seed"]
    command: ["node", "dist/database/seed.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-steedly}:${POSTGRES_PASSWORD:-steedly_password}@postgres:5432/${POSTGRES_DB:-steedly}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - steedly-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend-prod
      args:
        # NEXT_PUBLIC_* values are compiled into the browser bundle at build time
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000/api}
    container_name: steedly-frontend
    environment:
      NODE_ENV: production
    ports:
      - "3001:3001"
    depends_on:
      - backend
    networks:
      - steedly-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  steedly-network:
    driver: bridge

